name: All

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag'
        required: true
        default: 'shrimp'
        type: string
      branch:
        description: 'Git branch'
        required: true
        default: 'alpine'
        type: string
      ranch:
        description: 'Ranch'
        required: true
        default: 'Hidden Valley'
        type: string
        
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        board:
          - ambassador
          - banon
          - brask
          - brya
          - clapper
          - coral
          - corsola
          - cyan
          - dedede
          - edgar
          - elm
          - enguarde
          - glimmer
          - grunt
          - hana
          - hatch
          - jacuzzi
          - kalista
          - kefka
          - kukui
          - lulu
          - nami
          - nissa
          - octopus
          - orco
          - puff
          - pyro
          - reef
          - reks
          - relm
          - sand
          - sentry
          - snappy
          - stout
          - strongbad
          - tidus
          - trogdor
          - ultima
          - volteer
          - zork

    steps:
    - name: Checkout repo
      uses: actions/checkout@v4
      with:
        submodules: recursive
        token: ${{ secrets.GITHUB_TOKEN }}
        ref: ${{ inputs.branch }} 

    - name: Build Aurora
      run: |
        set -e
        chmod +x Aurora
        sudo apt update
        sudo apt install -y bc wget curl bash e2fsprogs gdisk cgpt rsync qemu-user-static binfmt-support
        sudo ./Aurora -b "${{ matrix.board }}" -t

    - name: Upload built shim
      uses: softprops/action-gh-release@v2
      with:
        name: Aurora ${{ inputs.tag }}
        tag_name: ${{ inputs.tag }}
        files: ./${{ matrix.board }}-aurora.bin
        overwrite_files: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
